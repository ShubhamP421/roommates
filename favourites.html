<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favourites — RoomMate</title>
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="ri-home-heart-fill"></i></div>
        <div>
          <span>RoomMate</span>
          <small class="logo-tagline">Find a place. Find your people.</small>
        </div>
      </a>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">
        <i class="ri-menu-line"></i>
      </button>

      <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="properties.html" class="nav-link">Find a Room</a>
        <a href="favourites.html" class="nav-link active">Favourites <span id="fav-count-badge" class="fav-badge" style="display:none;">0</span></a>
        <a href="post-property.html" class="nav-link">Post Property</a>
        <div id="nav-auth-container" style="display: inline-flex; gap: 0.5rem; align-items: center;">
          <a href="login.html" class="btn btn-sm btn-outline">Login</a>
        </div>
        <a href="post-property.html" class="btn btn-sm btn-primary"><i class="ri-add-line"></i> Post a Property</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 3rem 0;">
    <div class="section-header">
      <div>
        <h1 class="section-title"><i class="ri-heart-3-fill text-danger"></i> My Favourites</h1>
        <p class="section-subtitle">Stays you saved for quick comparison and easy access.</p>
      </div>
      <a href="properties.html" class="btn btn-sm btn-outline"><i class="ri-search-line"></i> Browse More Rooms</a>
    </div>

    <div class="properties-grid" id="favourites-grid">
      <!-- Dynamically filled by script below -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 RoomMate. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function renderFavourites() {
      const grid = document.getElementById('favourites-grid');
      if (!grid) return;

      const favIds = getFavorites();
      const favProperties = PROPERTIES_DATA.filter(p => favIds.includes(p.id));

      if (favProperties.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <i class="ri-heart-line empty-icon"></i>
            <h3 class="empty-title">No favourites yet</h3>
            <p class="empty-desc">Start exploring student-friendly stays and click the heart icon on any card to save it here.</p>
            <a href="properties.html" class="btn btn-primary"><i class="ri-compass-3-line"></i> Start Exploring Stays</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = favProperties.map(p => createPropertyCardHtml(p)).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderFavourites();

      // Listen for favorite toggles to dynamically update favourites page
      const originalToggleFav = window.toggleFavorite;
      window.toggleFavorite = function(id) {
        originalToggleFav(id);
        renderFavourites();
      };
    });
  </script>
</body>
</html>
