<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — RoomMate</title>
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="ri-home-heart-fill"></i></div>
        <div>
          <span>RoomMate</span>
          <small class="logo-tagline">Find a place. Find your people.</small>
        </div>
      </a>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">
        <i class="ri-menu-line"></i>
      </button>

      <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="properties.html" class="nav-link active">Find a Room</a>
        <a href="favourites.html" class="nav-link">Favourites <span id="fav-count-badge" class="fav-badge" style="display:none;">0</span></a>
        <a href="post-property.html" class="nav-link">Post Property</a>
        <div id="nav-auth-container" style="display: inline-flex; gap: 0.5rem; align-items: center;">
          <a href="login.html" class="btn btn-sm btn-outline">Login</a>
        </div>
        <a href="post-property.html" class="btn btn-sm btn-primary"><i class="ri-add-line"></i> Post a Property</a>
      </nav>
    </div>
  </header>

  <main class="container details-container" id="details-main-content">
    <!-- Populated dynamically by JavaScript -->
    <div class="empty-state">
      <i class="ri-loader-4-line empty-icon" style="animation: spin 1s linear infinite;"></i>
      <h3 class="empty-title">Loading property details...</h3>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 RoomMate. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const propertyId = Number(urlParams.get('id')) || 1;
      const property = PROPERTIES_DATA.find(p => p.id === propertyId);
      const container = document.getElementById('details-main-content');

      if (!property) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="ri-error-warning-line empty-icon" style="color: var(--danger);"></i>
            <h3 class="empty-title">Property Not Found</h3>
            <p class="empty-desc">The requested student stay could not be found or has been removed.</p>
            <a href="properties.html" class="btn btn-primary"><i class="ri-arrow-left-line"></i> Back to Properties</a>
          </div>
        `;
        return;
      }

      document.title = `${property.title} — RoomMate`;

      const fav = isFavorite(property.id);
      const heartIcon = fav ? 'ri-heart-3-fill' : 'ri-heart-3-line';
      const favText = fav ? 'Saved in Favourites' : 'Add to Favourites';

      const galleryImages = property.images;
      const mainImg = galleryImages[0];
      const thumb1 = galleryImages[1] || mainImg;
      const thumb2 = galleryImages[2] || mainImg;

      const facilityItems = property.facilities.map(f => `
        <div class="facility-item">
          <i class="${getFacilityIcon(f)}"></i>
          <span>${f}</span>
        </div>
      `).join('');

      const houseRulesItems = property.houseRules.map(r => `
        <li><i class="ri-checkbox-circle-fill"></i> ${r}</li>
      `).join('');

      const collegeItems = property.colleges.map(c => `
        <div class="college-card">
          <div class="college-name"><i class="ri-building-4-line text-primary"></i> ${c.name}</div>
          <div class="college-dist">${c.distance} away</div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="details-header">
          <div class="details-title-row">
            <div>
              <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
                <span class="badge badge-type">${property.type}</span>
                <span class="badge badge-gender"><i class="ri-user-smile-line"></i> ${property.gender}</span>
                ${property.available ? '<span class="badge badge-available">Available Now</span>' : '<span class="badge badge-occupied">Occupied</span>'}
              </div>
              <h1 class="details-title">${property.title}</h1>
              <p class="text-muted" style="font-size: 1.05rem;"><i class="ri-map-pin-line text-primary"></i> ${property.location} &nbsp;•&nbsp; <i class="ri-star-fill text-warning"></i> <strong>${property.rating}</strong> (${property.reviewsCount} student reviews)</p>
            </div>
            <div class="details-price-tag">
              ₹${property.rent.toLocaleString('en-IN')}
              <span>per student / month</span>
            </div>
          </div>
        </div>

        <!-- GALLERY -->
        <div class="gallery-grid">
          <img src="${mainImg}" alt="${property.title}" class="gallery-main" id="main-gallery-img">
          <img src="${thumb1}" alt="${property.title}" class="gallery-thumb" onclick="swapGalleryImage(this.src)">
          <img src="${thumb2}" alt="${property.title}" class="gallery-thumb" onclick="swapGalleryImage(this.src)">
        </div>

        <!-- MAIN CONTENT & OWNER SIDEBAR GRID -->
        <div class="details-content-grid">
          <div>
            <!-- Overview & Description -->
            <div class="details-section">
              <h3 class="details-section-title">Property Description</h3>
              <p style="font-size: 1rem; color: var(--dark-heading); line-height: 1.7;">${property.description}</p>
            </div>

            <!-- Facilities -->
            <div class="details-section">
              <h3 class="details-section-title">Amenities & Facilities</h3>
              <div class="facility-list-grid">
                ${facilityItems}
              </div>
            </div>

            <!-- House Rules -->
            <div class="details-section">
              <h3 class="details-section-title">House Rules & Policies</h3>
              <ul class="rules-list">
                ${houseRulesItems}
              </ul>
            </div>

            <!-- Nearby Colleges & Landmarks -->
            <div class="details-section">
              <h3 class="details-section-title">Nearby Colleges & Transport</h3>
              <div class="colleges-list">
                ${collegeItems}
              </div>
            </div>
          </div>

          <!-- OWNER CONTACT SIDEBAR CARD -->
          <div>
            <div class="owner-card">
              <div class="owner-profile">
                <div class="owner-avatar">${property.owner.name.charAt(0)}</div>
                <div>
                  <div class="owner-name">${property.owner.name}</div>
                  <div class="owner-badge"><i class="ri-checkbox-circle-fill"></i> Verified Owner</div>
                  <small class="text-muted" style="display:block; margin-top: 2px;">${property.owner.responseTime}</small>
                </div>
              </div>

              <div style="margin-bottom: 1.25rem;">
                <p style="font-size: 0.88rem; color: var(--muted); margin-bottom: 0.5rem;"><i class="ri-phone-line"></i> Direct Phone Contact Available</p>
                <button class="btn btn-primary btn-block" onclick="openContactModal(${property.id})"><i class="ri-chat-3-line"></i> Contact Property Owner</button>
              </div>

              <button class="btn btn-outline btn-block" id="detail-fav-btn" onclick="toggleDetailFav(${property.id})">
                <i class="${heartIcon}" id="detail-fav-icon"></i> <span id="detail-fav-text">${favText}</span>
              </button>

              <div style="margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); text-align: center;">
                <i class="ri-shield-check-line text-accent"></i> Zero brokerage guaranteed on RoomMate.
              </div>
            </div>
          </div>
        </div>
      `;
    });

    function swapGalleryImage(src) {
      const main = document.getElementById('main-gallery-img');
      if (main) main.src = src;
    }

    function toggleDetailFav(id) {
      const added = toggleFavorite(id);
      const icon = document.getElementById('detail-fav-icon');
      const text = document.getElementById('detail-fav-text');
      if (icon && text) {
        if (added) {
          icon.className = 'ri-heart-3-fill';
          text.textContent = 'Saved in Favourites';
        } else {
          icon.className = 'ri-heart-3-line';
          text.textContent = 'Add to Favourites';
        }
      }
    }
  </script>
</body>
</html>
