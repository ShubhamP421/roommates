<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — RoomMate</title>
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="ri-home-heart-fill"></i></div>
        <div>
          <span>RoomMate</span>
          <small class="logo-tagline">Find a place. Find your people.</small>
        </div>
      </a>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">
        <i class="ri-menu-line"></i>
      </button>

      <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="properties.html" class="nav-link">Find a Room</a>
        <a href="favourites.html" class="nav-link">Favourites <span id="fav-count-badge" class="fav-badge" style="display:none;">0</span></a>
        <a href="post-property.html" class="nav-link">Post Property</a>
        <div id="nav-auth-container" style="display: inline-flex; gap: 0.5rem; align-items: center;">
          <a href="login.html" class="btn btn-sm btn-primary">Login</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;"><i class="ri-user-smile-fill"></i></div>
        <h2>Welcome Back</h2>
        <p class="text-muted">Log in to manage your saved stays and inquiries.</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label><i class="ri-mail-line"></i> Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="student@college.edu.in" required value="student@somaiya.edu">
        </div>

        <div class="form-group">
          <label><i class="ri-lock-line"></i> Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="password123">
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.25rem;">
          <i class="ri-login-circle-fill"></i> Login to Account
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="signup.html" class="fw-600">Sign Up Now</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 RoomMate. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
